<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LED看板ジェネレータ</title>
  <link rel="stylesheet" href="/styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom@4.6.0/dist/panzoom.min.js"></script>
  <script defer src="/script.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body x-data="ledcanvas">
  <header>
    <h1>LED看板ジェネレータ</h1>
  </header>
  <div class="controls-container" x-data="{ open: false }" @click.outside="open = false" :class="{ 'is-open': open }">
    <button type="button" class="hamburger-button" aria-label="Menu" @click="open = !open">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>
    <ol class="controls" start="0">
      <li>
        <fieldset>
          <legend>描画タイプを選択</legend>
          <input type="radio" id="upload-image" name="inputtype" value="uploadimage" checked x-model="inputType" />
          <label for="upload-image">ドット絵をアップロード</label>
          <input type="radio" id="from-drawing" name="inputtype" value="fromdrawing" x-model="inputType" />
          <label for="from-drawing">ここで書く</label>
        </fieldset>
      </li>
      <li x-show="inputType === 'uploadimage'">
        <p>その辺のドット絵作成ツールでドット絵を作成</p>
        <p>※その時使ったドットのサイズを覚えておいて！</p>
      </li>
      <li x-show="inputType === 'uploadimage'">
        <label for="upload">ドット絵をアップロード: </label>
        <input type="file" id="upload" accept="image/*" @change="uploadFile">
      </li>
      <li x-show="inputType === 'fromdrawing'">
        <div x-show="isCacheAvailable">
          <button type="button" @click="displayCache">前回の作業内容をキャッシュから読み込み</button>
        </div>
        <label for="doesSavetoCache">変更をキャッシュへ逐次保存する</label>
        <input type="checkbox" id="doesSavetoCache" x-model="doesSavetoCache" />
      </li>
      <li x-show="inputType === 'fromdrawing'">
        <fieldset>
          <legend>ドット数を入力してください</legend>
          <div>
            <label for="coord-x">横</label>
            <input type="number" id="coord-x" name="x" min="1" x-model.lazy.number="patternNumWidth">
          </div>
          <div>
            <label for="coord-y">縦</label>
            <input type="number" id="coord-y" name="y" min="1" x-model.lazy.number="patternNumHeight">
          </div>
        </fieldset>
      </li>
      <li x-show="inputType === 'fromdrawing'">
        <label for="brushcolor">ブラシカラーを選択: </label>
        <input type="color" id="brushcolor" value="#000000" x-model.lazy="brushColor">
      </li>
      <li>
        <label for="basecolor">ベースカラーを選択: </label>
        <input type="color" id="basecolor" value="#000000" x-model.lazy="baseColor">
      </li>
      <li x-show="inputType === 'uploadimage'">
        <label for="patternsize-in">(入力)ドットのサイズを入力(px): </label>
        <input type="number" id="patternsize-in" min="1" x-model.lazy.number="patternSizeIn">
      </li>
      <li>
        <label for="patternsize-out">(出力)ドットのサイズを入力(px): </label>
        <input type="number" id="patternsize-out" min="1" x-model.lazy.number="patternSizeOut">
      </li>
      <li>
        <label for="circlesize">円の直径を入力(px): </label>
        <input type="number" id="circlesize" min="1" x-model.lazy.number="circleSize">
      </li>
      <li>
        <button type="button" @click="downloadImage">ダウンロード</button>
      </li>
    </ol>
    <p>エディタの使い方</p>
    <p>左クリック: 描画 (「ここで書く」場合のみ)</p>
    <p>スクロール: ズーム</p>
    <p>右クリック: パンニング</p>
  </div>
  <div id="canvasViewport" x-ref="canvasViewport">
    <div id="canvasContainer" x-ref="canvasContainer">
      <canvas id="overlayCanvas" x-ref="overlayCanvas"></canvas>
      <canvas id="mainCanvas" x-ref="mainCanvas"></canvas>
    </div>
  </div>
  <footer>
    <p>
      編集処理はブラウザ内で完結しており、画像は外部に送信されません。
    </p>
  </footer>
</body>

</html>
